[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libreone"
version = "0.2.0"
description = "LibreOne AI-native computing platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["libreone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
